name: self-compile
# The one self-compile run: dist/jz.wasm is jz compiled by jz (scripts/self.js:
# parse → jzify → prepare → compile → watr-encode, the whole pipeline in wasm),
# and everything here is a correctness check made with that compiler. Speed is
# not measured on a shared runner: the self-compile perf gate is a local release
# step (`npm run test:self:perf`, CONTRIBUTING.md "Performance & size invariant").
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  self-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      # One invocation owns one fresh ordinary kernel and a separate checkpoint
      # overlay. Round-trip, O0/O2/O3 parity/oracles, the hosted suite and recursive
      # compilation consume that ordinary artifact, in memory-bounded processes.
      - name: bootstrap, parity, hosted suite and recursive jz × jz
        run: npm run test:bootstrap -- --full
        env:
          JZ_FUZZ_GATE: '0.15'
