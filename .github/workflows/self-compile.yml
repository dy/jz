name: self-compile
# The one self-compile run: dist/jz.wasm is jz compiled by jz (scripts/self.js:
# parse → jzify → prepare → compile → watr-encode, the whole pipeline in wasm),
# and everything here is a correctness check made with that compiler. Speed is
# not measured on a shared runner: the self-compile perf gate is a local release
# step (`npm run test:self:perf`, CONTRIBUTING.md "Performance & size invariant").
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
jobs:
  self-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: build dist/jz.wasm
        run: npm run build
      # A fresh private compiler round-trips real programs through the in-wasm pipeline.
      - name: self-compile round-trip
        run: npm run test:self
      # The whole host test suite, every program compiled by dist/jz.wasm: any
      # divergence from the native run is a self-compile bug. JZ_FUZZ_GATE shrinks
      # the fuzz seed counts (the full gate exceeds the runner's job limit).
      - name: full suite via dist/jz.wasm
        run: npm run test:wasm
        env:
          JZ_FUZZ_GATE: '0.15'
      # The complete compiler graph through the kernel, and the result made to compile a probe.
      - name: recursive jz × jz
        run: node scripts/recursive-self-check.mjs
