name: bench
# Competitive-regression gate (see CONTRIBUTING.md "Performance & size invariant").
# Runs on every push and PR. HARD-GATED here: checksums/parity, wasm sizes, and
# compile success. TIMING ratios (speed pins, geomeans, fastest-wasm, examples,
# floatbeat, perf-fuzz) print informational on CI — a shared 2-core runner reads
# identical builds up to 15× slower, so timing is asserted off-CI where the
# release discipline runs `npm run test:bench` on stable hardware (test/bench.js
# okTiming).
# Manual reference runs additionally enforce every claim against fresh paired
# measurements and retain the source-pinned dataset and failures as artifacts.
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Measure fresh release evidence and enforce speed, size and memory claims
        type: boolean
        default: true
      contenders:
        description: Rivals measured per claim class and case (the nearest by stored evidence); 0 measures every lane
        type: string
        default: '2'
  # The full matrix re-ranks every lane weekly; a main push refreshes only the contenders.
  schedule:
    - cron: '0 3 * * 1'
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'bench/results.json'
      - 'bench/results-ci.json'
      - 'bench/results-linux.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'bench/results.json'
      - 'bench/results-ci.json'
      - 'bench/results-linux.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Publishing a main-branch snapshot must not be interrupted mid-transaction.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # The publish step commits bench/results-ci.json back to main;
    # the default GITHUB_TOKEN is read-only and 403s that push without this.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      # Extra "Run as JS" runtimes (Deno, Bun). bench.mjs gates every target on
      # `available`, so a missing tool just drops its row — additive, never fails.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      # Safari's engine: standalone JavaScriptCore shell via jsvu (→ ~/.jsvu/bin/jsc).
      # Non-fatal — bench.mjs drops the jsc row if the install fails.
      - name: install jsc (JavaScriptCore)
        run: |
          npx --yes jsvu --engines=javascriptcore --os=linux64 || true
          echo "$HOME/.jsvu/bin" >> "$GITHUB_PATH"
      # NumPy native-reference rows (python3 is preinstalled on ubuntu).
      - name: install numpy
        run: python3 -m pip install --break-system-packages numpy || pip install numpy || true
      # GNU time supplies RSS; SIMDe supplies wasm2c's SIMD headers.
      - name: install measurement and native headers
        run: sudo apt-get install -y time libsimde-dev clang
      # wasmtime runs the standalone `jz → wasmtime` / `jz → wasm2c` reference rows.
      - name: install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash || true
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      # Pin zig: the runner's preinstalled zig (0.13) fails every bench zig/
      # zig-wasm build (API churn) — 0/43 rows made those rivals silently
      # uncontested until the coverage gate hardened. Match the version the
      # sources build with locally.
      - name: pin zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # TinyGo (the lean go→wasm rival — a separate row from go-wasm's stock
      # toolchain). Match PLAN's pinned release and smoke-build wasip1 so a
      # Go-version mismatch fails here instead of removing a required rival.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: install tinygo
        run: |
          curl -fsSL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo_0.42.0_amd64.deb
          echo '2082c4762fea6d5cc4cd1f4a243eaacf07b12f576717d4c6b74828bd163cb563  /tmp/tinygo.deb' | sha256sum -c -
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version
          printf 'package main\nfunc main() {}\n' > /tmp/tg.go
          tinygo build -target=wasip1 -o /tmp/tg.wasm /tmp/tg.go
      # Rust→wasm baseline needs the wasm target added to the preinstalled rustc;
      # the runner ships rustc but NOT the wasm32-wasip1 std, so without this every
      # rust-wasm case fails ("can't find crate for std") and the hero's Rust→wasm
      # stat goes null (why the 3rd hero stat was dropped in 83d6add5).
      - name: rust wasm target
        run: rustup target add wasm32-wasip1 || true
      # Competitor toolchains + binaryen (provides wasm-opt).
      - run: npm install --ignore-scripts --no-save assemblyscript@~0.27.0 binaryen
      # Porffor's npm 0.61.x is the frozen pre-rewrite engine. The author's
      # install is the release binary (porffor.dev/install.sh); pin the tested
      # release, alpha 13 (547c781, 2026-09-30), by its tag so the comparison is
      # reproducible; a failed rival install is fatal rather than silently
      # weakening coverage.
      - name: porffor alpha 13 (release, pinned)
        env:
          PORFFOR_RELEASE: alpha-13
          PORFFOR_REV: 547c7815125b6f02474591950f8b0dd7031a03f0
        run: |
          curl -fsSL https://porffor.dev/install.sh | sh -s -- "$PORFFOR_RELEASE"
          test -x "$HOME/.local/bin/porf"
          "$HOME/.local/bin/porf" --version | grep -q "${PORFFOR_REV:0:7}"
          echo "PORF_BIN=$HOME/.local/bin/porf" >> "$GITHUB_ENV"
      - name: expose toolchains on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: install Perry 0.5.1520
        run: |
          npm install --global @perryts/perry@0.5.1520
          echo "PERRY_BIN=$(command -v perry)" >> "$GITHUB_ENV"
          echo "PERRY_NO_UPDATE_CHECK=1" >> "$GITHUB_ENV"
          echo "PERRY_UPDATE_MODE=off" >> "$GITHUB_ENV"
          perry --version
      - name: build scriptc current source (pinned)
        run: |
          node scripts/install-scriptc.mjs "$RUNNER_TEMP/scriptc"
          echo "SCRIPTC_BIN=$RUNNER_TEMP/scriptc/scriptc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/scriptc/scriptc" --version
      - name: install TypeScriptCompiler pre-alpha87
        run: |
          sudo apt-get install -y clang libcurl4-openssl-dev
          curl -fsSL -o "$RUNNER_TEMP/tslang.tar.gz" https://github.com/ASDAlexander77/TypeScriptCompiler/releases/download/v0.0-pre-alpha87/tslang-v0.0-pre-alpha87-ubuntu-24.04-x64.tar.gz
          echo "e1b0cbb0f7325326a2aa83921cd96d3c0a5850321b68f97cc7d9c76b8b3f13a7  $RUNNER_TEMP/tslang.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tslang"
          tar xzf "$RUNNER_TEMP/tslang.tar.gz" -C "$RUNNER_TEMP/tslang"
          for var in GC_LIB_PATH TSLANG_LIB_PATH DEFAULT_LIB_PATH; do
            echo "$var=$RUNNER_TEMP/tslang" >> "$GITHUB_ENV"
          done
          echo "TSLANG_BIN=$RUNNER_TEMP/tslang/tslang" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/tslang/tslang" --version
      - name: native compiler installation smoke
        run: |
          printf 'console.log("scriptc ready");\n' > "$RUNNER_TEMP/scriptc-smoke.ts"
          "$SCRIPTC_BIN" build "$RUNNER_TEMP/scriptc-smoke.ts" -o "$RUNNER_TEMP/scriptc-smoke"
          test "$("$RUNNER_TEMP/scriptc-smoke")" = 'scriptc ready'
          printf 'declare function jz_bench_now(): number;\nconst performance = { now: () => jz_bench_now() };\nconst main = () => { print(performance.now() > 0 ? "tslang ready" : "bad clock"); };\nmain();\n' > "$RUNNER_TEMP/tslang-smoke.ts"
          clang -O2 -fPIC -c bench/_lib/tslang-clock.c -o "$RUNNER_TEMP/tslang-clock.o"
          "$TSLANG_BIN" --emit=exe --opt --opt_level=3 --relocation-model=pic --obj="$RUNNER_TEMP/tslang-clock.o" "$RUNNER_TEMP/tslang-smoke.ts" -o "$RUNNER_TEMP/tslang-smoke"
          test "$("$RUNNER_TEMP/tslang-smoke")" = 'tslang ready'
      - name: versions
        run: |
          node --version
          asc --version || true
          "$PORF_BIN" --version
          "$PERRY_BIN" --version
          wasm-opt --version || true
      - name: Perry native smoke (checksum-verified)
        run: |
          node bench/bench.mjs --targets=perry --cases=alpha --json="$RUNNER_TEMP/perry-smoke.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const r = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/perry-smoke.json`, 'utf8'))
          const row = r.cases.alpha?.targets.perry
          if (row?.parity !== 'ok' || !(row.medianUs > 0) || !(row.bytes > 0))
            throw new Error(`Perry smoke failed: ${JSON.stringify(row)}`)
          JS
      - name: install wasm2c (wabt prebuilt)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wabt.tar.gz" https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-linux-x64.tar.gz
          tar xzf "$RUNNER_TEMP/wabt.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/wabt-1.0.41/bin/wasm2c --version
          echo "$RUNNER_TEMP/wabt-1.0.41/bin" >> "$GITHUB_PATH"
          echo "WABT_W2C_DIR=$RUNNER_TEMP/wabt-1.0.41/share/wabt/wasm2c" >> "$GITHUB_ENV"
      - run: npm run test:bench
        if: ${{ !inputs.reference && github.event_name != 'schedule' }}
      # Same-machine, alternating paired rounds. The strict claims gate reads
      # these fresh files; CI does not turn a timing loss into an informational row.
      # A verdict needs only the lanes that could lead: --contenders measures jz
      # against the nearest rivals of each claim class per case (bench/README.md).
      - name: measure release reference
        if: ${{ inputs.reference }}
        shell: bash
        env:
          CONTENDERS: ${{ inputs.contenders }}
        run: |
          flag=""; [ "${CONTENDERS:-2}" != "0" ] && flag="--contenders=${CONTENDERS:-2}"
          node bench/bench.mjs --targets=jz,c-wasm,rust-wasm,go-wasm,tinygo,zig-wasm,as,porf-native,v8,deno,bun,jsc,jz-w2c $flag --paired=6 --json="$RUNNER_TEMP/reference.json" 2>&1 | tee "$RUNNER_TEMP/reference.log"
      - name: enforce release claims
        if: ${{ inputs.reference }}
        shell: bash
        env:
          JZ_BENCH_RESULTS: ${{ runner.temp }}/reference.json
        run: node test/bench-claims.js 2>&1 | tee "$RUNNER_TEMP/claims.log"
      - name: retain release evidence
        if: ${{ always() && inputs.reference }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference.json
            ${{ runner.temp }}/reference.log
            ${{ runner.temp }}/claims.log
          if-no-files-found: error
      # ── native-lane smoke gate (audit-#12 step 4) ──────────────────────────
      # This proves both native translators still (a) build, (b) run, (c) match
      # jz's own checksum on a few representative cases — the regression a
      # translator-side codegen bug (like audit-#12's wasm2c `return_call`
      # opcode-0x12 defect) would trip. nqueens is that exact repro case, kept
      # in the smoke set as a permanent regression guard for it.
      - name: install w2c2 (build from source — no prebuilt/package exists)
        if: ${{ !inputs.reference && github.event_name != 'schedule' }}
        run: |
          mkdir "$RUNNER_TEMP/w2c2"
          curl -fsSL https://codeload.github.com/turbolent/w2c2/tar.gz/700f556539ea7c7995e6645b9b80e3edf9c9b271 | tar xz --strip-components=1 -C "$RUNNER_TEMP/w2c2"
          cmake -B "$RUNNER_TEMP/w2c2/w2c2/build" "$RUNNER_TEMP/w2c2/w2c2"
          cmake --build "$RUNNER_TEMP/w2c2/w2c2/build" --target w2c2 -j
          "$RUNNER_TEMP/w2c2/w2c2/build/w2c2" -h
      - name: native-lane smoke (jz-w2c + jz-w2c2, checksum-verified)
        if: ${{ !inputs.reference && github.event_name != 'schedule' }}
        env:
          WABT_W2C_DIR: ${{ runner.temp }}/wabt-1.0.41/share/wabt/wasm2c
          W2C2_DIR: ${{ runner.temp }}/w2c2/w2c2
          W2C2_BIN: ${{ runner.temp }}/w2c2/w2c2/build/w2c2
        run: |
          export PATH="$RUNNER_TEMP/wabt-1.0.41/bin:$PATH"
          node bench/bench.mjs --targets=jz-w2c,jz-w2c2 --cases=nqueens,wordcount --json="$RUNNER_TEMP/native-smoke.json" || exit 1
          # tokenizer now emits multi-value functions, which only WABT supports.
          node bench/bench.mjs --targets=jz-w2c --cases=tokenizer --json="$RUNNER_TEMP/native-multivalue-smoke.json" || exit 1
          node -e '
            let bad = [];
            for (const [file, ids, targets] of [
              ["native-smoke.json", ["nqueens", "wordcount"], ["jz-w2c", "jz-w2c2"]],
              ["native-multivalue-smoke.json", ["tokenizer"], ["jz-w2c"]],
            ]) {
              const r = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/" + file, "utf8"));
              for (const id of ids) for (const tid of targets) {
                const t = r.cases?.[id]?.targets?.[tid];
                if (!t) { bad.push(`${id}/${tid}: missing`); continue; }
                if (t.status === "fail") { bad.push(`${id}/${tid}: FAIL — ${t.reason}`); continue; }
                if (t.parity !== "ok") bad.push(`${id}/${tid}: parity=${t.parity}`);
              }
            }
            if (bad.length) { console.error("native-lane smoke FAILED:\n" + bad.join("\n")); process.exit(1); }
            console.log("native-lane smoke OK — both translators match checksums; WABT also passes multi-value returns");
          '
      # Refresh the runner dataset on main; pages.yml redeploys on completion.
      # Weekly, every available target is measured on this one machine; a main
      # push refreshes jz and the contenders of each case into the stored rows,
      # certified by the anchors (a drifted runner skips the publish). Browser-
      # runner artifacts (bench/web/*.wasm) are rebuilt separately by pages.yml.
      - name: publish bench snapshot
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # Seed the checksum oracle from current reference evidence, not old CI
            # results. This is a full refresh: all timings below come from this runner.
            cp bench/results.json bench/results-ci.json
            node bench/bench.mjs --targets=nat,c-wasm,rust-wasm,go-wasm,tinygo,zig-wasm,rust,zig,go,v8,deno,bun,jsc,as,porf-native,perry,scriptc,tslang,jz,jz-wasmtime,jz-w2c,wat,numpy --json=bench/results-ci.json || exit 1
          else
            set -o pipefail
            log="${RUNNER_TEMP:-$(mktemp -d)}/publish.log"
            if ! node bench/bench.mjs --targets=jz,c-wasm,rust-wasm,go-wasm,tinygo,zig-wasm,as,porf-native,v8,deno,bun,jsc,perry,jz-w2c --contenders --json=bench/results-ci.json --merge --verify-anchors 2>&1 | tee "$log"; then
              grep -q '^\[anchors\] DRIFT' "$log" && { echo 'runner drifted from the stored rows: snapshot not refreshed'; exit 0; }
              exit 1
            fi
          fi
          # A missing/failed Perry lane must not silently disappear from the page.
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { timedBenchmarkRow } from './assets/headline.js'
          const r = JSON.parse(readFileSync('bench/results-ci.json', 'utf8'))
          if (!timedBenchmarkRow(r.cases.alpha?.targets.perry))
            throw new Error('Published snapshot is missing a checksum-verified Perry alpha timing')
          JS
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Keep the reference-machine evidence in results.json. Only the
          # runner's results-ci.json is committed by this workflow.
          git add bench/results-ci.json
          git diff --cached --quiet || git commit -m 'bench: refresh results-ci.json (runner dataset) [skip ci]'
          # Overlapping runs refresh the same generated dataset. `-X theirs`
          # (in rebase terms: the commit being replayed, i.e. OUR snapshot) auto-
          # resolves. Retry covers a push landing mid-rebase. Skip publication
          # if benchmark inputs changed; documentation and generated snapshots
          # do not invalidate measurements or trigger a replacement bench run.
          # Match the workflow's ignored paths, and reject rewritten history.
          for i in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
               ! git diff --quiet "$GITHUB_SHA" origin/main -- . \
                 ':(glob,exclude)**/*.md' ':(glob,exclude)**/*.svg' ':(glob,exclude)**/*.html' \
                 ':(exclude).work/**' ':(exclude)LICENSE' \
                 ':(exclude)bench/results.json' ':(exclude)bench/results-ci.json' \
                 ':(exclude)bench/results-linux.json'; then
              echo "stale snapshot: benchmark inputs or history changed since $GITHUB_SHA — skipping publish"
              exit 0
            fi
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort || true; exit 1; }
          done
          echo 'Could not publish the benchmark snapshot after 3 attempts' >&2
          exit 1
