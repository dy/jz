name: bench
# Two kinds of run share this workflow (see bench/README.md "CI").
#
# Gate (push, pull_request): HARD-GATED here: checksums/parity, wasm sizes, and
# compile success. TIMING ratios (speed pins, geomeans, fastest-wasm, examples,
# floatbeat, perf-fuzz) print informational on CI — a shared 2-core runner reads
# identical builds up to 15× slower, so timing is asserted off-CI where the
# release discipline runs `npm run test:bench` on stable hardware (test/bench.js
# okTiming). A gate publishes nothing: one runner cannot re-measure every lane of
# every case within the 6-hour job limit, and rows from another machine would
# break the case's same-machine ratios.
#
# Measurement (schedule, workflow_dispatch): every lane of every case, the corpus
# split by case across jobs sized from measured wall times (bench/shards.mjs plan),
# so each case runs whole on one machine; the publish job merges the shards into
# one dataset (bench/shards.mjs merge) that names each case's machine.
#   schedule, or reference=false: every lane once → bench/results-ci.json.
#   reference=true: the claim lanes in 6 paired rounds, the rest once; the claims
#     gate decides. Passed: bench/results.json, bench/bench.svg and the README
#     tables are committed. Failed: the evidence is uploaded and the run fails
#     with the failing claims.
#   cases=…: a probe of those cases, uploaded as probe.json, never published.
# A publication that does not happen says why, in the log and the job summary.
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Pair the claim lanes, enforce the release claims, and on a pass commit bench/results.json (false refreshes bench/results-ci.json)
        type: boolean
        default: true
      cases:
        description: Cases to measure, comma-separated (empty measures the corpus); a subset is a probe and is never published
        type: string
        default: ''
  # The CI runner view re-measures every lane weekly.
  schedule:
    - cron: '0 3 * * 1'
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'bench/results.json'
      - 'bench/results-ci.json'
      - 'bench/results-linux.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'bench/results.json'
      - 'bench/results-ci.json'
      - 'bench/results-linux.json'
# Gates of one ref queue behind each other (a PR's newest push cancels its older
# run); a reference run and a CI refresh queue separately, never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.reference && 'reference' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ci' || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
      paired: ${{ steps.plan.outputs.paired }}
      paired-targets: ${{ steps.plan.outputs.paired-targets }}
      node: ${{ steps.versions.outputs.node }}
      deno: ${{ steps.versions.outputs.deno }}
      bun: ${{ steps.versions.outputs.bun }}
      jsc: ${{ steps.versions.outputs.jsc }}
      asc: ${{ steps.versions.outputs.asc }}
    env:
      MEASURE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        if: env.MEASURE == 'true'
      # Every shard runs the same engine builds, a rerun shard hours later included:
      # each build the merge compares that would otherwise float is resolved once
      # here and pinned there.
      - uses: actions/setup-node@v4
        if: env.MEASURE == 'true'
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        if: env.MEASURE == 'true'
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        if: env.MEASURE == 'true'
      - id: versions
        if: env.MEASURE == 'true'
        run: |
          echo "node=$(node --version | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "deno=$(deno --version | head -1 | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "bun=$(bun --version)" >> "$GITHUB_OUTPUT"
          # jsvu's own source of the latest Linux JavaScriptCore build
          echo "jsc=$(curl -fsSL https://webkitgtk.org/jsc-built-products/x86_64/release/LAST-IS | grep -o '^[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "asc=$(npm view 'assemblyscript@~0.27.0' version --json | node -e 'console.log([].concat(JSON.parse(require("fs").readFileSync(0, "utf8"))).at(-1))')" >> "$GITHUB_OUTPUT"
      - if: env.MEASURE == 'true'
        run: npm ci --ignore-scripts
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REFERENCE: ${{ inputs.reference }}
          CASES: ${{ inputs.cases }}
        run: |
          if [ "$MEASURE" != true ]; then
            echo 'mode=gate' >> "$GITHUB_OUTPUT"
            echo 'matrix=[{"kind":"gate","name":"bench"}]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode=ci; [ "$EVENT" = workflow_dispatch ] && [ "$REFERENCE" = true ] && mode=reference
          node bench/shards.mjs plan --mode=$mode ${CASES:+--cases=$CASES} > "$RUNNER_TEMP/plan.json"
          node --input-type=module - "$mode" "$RUNNER_TEMP/plan.json" <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const [mode, file] = process.argv.slice(2), plan = JSON.parse(readFileSync(file, 'utf8'))
          const count = s => { const n = s.cases.split(',').length; return `${n} case${n === 1 ? '' : 's'}` }
          const matrix = plan.shards.map(s => ({ ...s, name: `${mode} shard ${s.index}: ${count(s)}, ~${s.minutes} min` }))
          console.log(`mode=${mode}\nmatrix=${JSON.stringify(matrix)}\ntargets=${plan.targets}\npaired=${plan.paired}\npaired-targets=${plan.pairedTargets}`)
          JS
          { echo "### bench $mode plan"; echo '```'; node -e 'for (const s of require(process.argv[1]).shards) console.log(`shard ${s.index}: ~${s.minutes} min  ${s.cases}`)' "$RUNNER_TEMP/plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  bench:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Neither a gate nor a shard writes to the repository; the publish job does.
    permissions:
      contents: read
    env:
      # A measurement job fails on a missing toolchain instead of dropping its lane.
      BENCH_STRICT: ${{ matrix.kind == 'shard' && '1' || '' }}
    steps:
      # Full history: every job of a run then abbreviates the measured commit alike.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node || '24' }}
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      # Extra "Run as JS" runtimes (Deno, Bun). bench.mjs gates every target on
      # `available`, so a missing tool just drops its row on a gate.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ needs.plan.outputs.deno || 'v2.x' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ needs.plan.outputs.bun || 'latest' }}
      # Safari's engine: standalone JavaScriptCore shell via jsvu (→ ~/.jsvu/bin/jsc),
      # a measurement's at the build its plan pinned (→ ~/.jsvu/bin/jsc-<build>).
      - name: install jsc (JavaScriptCore)
        env:
          JSC: ${{ needs.plan.outputs.jsc }}
        run: |
          if [ -n "$JSC" ]; then
            npx --yes jsvu --os=linux64 "javascriptcore@$JSC"
            "$HOME/.jsvu/bin/jsc-$JSC" -e 'print("jsc ready")' | grep -q 'jsc ready'
            echo "JSC_BIN=$HOME/.jsvu/bin/jsc-$JSC" >> "$GITHUB_ENV"
          else
            npx --yes jsvu --engines=javascriptcore --os=linux64 || test -z "$BENCH_STRICT"
          fi
          echo "$HOME/.jsvu/bin" >> "$GITHUB_PATH"
      # NumPy native-reference rows (python3 is preinstalled on ubuntu).
      - name: install numpy
        run: python3 -m pip install --break-system-packages numpy || pip install numpy || test -z "$BENCH_STRICT"
      # GNU time supplies RSS; SIMDe supplies wasm2c's SIMD headers. wasm2c includes
      # <simde/wasm/simd128.h>, which SIMDe has from 0.7.4; Ubuntu 24.04's
      # libsimde-dev is 0.7.2 (arm/ and x86/ only), so the release is pinned here.
      - name: install measurement and native headers
        run: |
          sudo apt-get update && sudo apt-get install -y time clang
          curl -fsSL -o "$RUNNER_TEMP/simde.tar.xz" https://github.com/simd-everywhere/simde/releases/download/v0.8.2/simde-amalgamated-0.8.2.tar.xz
          echo "59068edc3420e75c5ff85ecfd80a77196fb3a151227a666cc20abb313a5360bf  $RUNNER_TEMP/simde.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/simde/simde"
          tar xJf "$RUNNER_TEMP/simde.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/simde/simde"
          test -f "$RUNNER_TEMP/simde/simde/wasm/simd128.h"
          echo "SIMDE_DIR=$RUNNER_TEMP/simde" >> "$GITHUB_ENV"
      # wasmtime runs the standalone `jz → wasmtime` / `jz → wasm2c` reference rows.
      # Pinned: shards installing minutes apart must run one wasmtime.
      - name: install wasmtime 50.0.1
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v50.0.1 || test -z "$BENCH_STRICT"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      # Pin zig: the runner's preinstalled zig (0.13) fails every bench zig/
      # zig-wasm build (API churn) — 0/43 rows made those rivals silently
      # uncontested until the coverage gate hardened. Match the version the
      # sources build with locally.
      - name: pin zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # TinyGo (the lean go→wasm rival — a separate row from go-wasm's stock
      # toolchain). Match PLAN's pinned release and smoke-build wasip1 so a
      # Go-version mismatch fails here instead of removing a required rival.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: install tinygo
        run: |
          curl -fsSL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo_0.42.0_amd64.deb
          echo '2082c4762fea6d5cc4cd1f4a243eaacf07b12f576717d4c6b74828bd163cb563  /tmp/tinygo.deb' | sha256sum -c -
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version
          printf 'package main\nfunc main() {}\n' > /tmp/tg.go
          tinygo build -target=wasip1 -o /tmp/tg.wasm /tmp/tg.go
      # Rust→wasm baseline needs the wasm target added to the preinstalled rustc;
      # the runner ships rustc but NOT the wasm32-wasip1 std, so without this every
      # rust-wasm case fails ("can't find crate for std") and the hero's Rust→wasm
      # stat goes null (why the 3rd hero stat was dropped in 83d6add5).
      - name: rust wasm target
        run: rustup target add wasm32-wasip1 || test -z "$BENCH_STRICT"
      # Competitor toolchains + binaryen (provides wasm-opt), in one install: a
      # second --no-save install would prune this one's packages. jco builds the
      # ComponentizeJS lane, componentize-qjs its QuickJS twin; js2wasm is
      # @loopdive/js2 (its wasm-opt pass takes binaryen ^132).
      - run: npm install --ignore-scripts --no-save assemblyscript@${{ needs.plan.outputs.asc || '~0.27.0' }} binaryen @bytecodealliance/jco@1.40.0 @bytecodealliance/componentize-js@0.23.0 componentize-qjs@0.5.0 @loopdive/js2@0.71.0
      # Porffor's npm 0.61.x is the frozen pre-rewrite engine. The author's
      # install is the release binary (porffor.dev/install.sh); pin the tested
      # release, alpha 19 (0c135ce, 2026-10-21), by its tag so the comparison is
      # reproducible; a failed rival install is fatal rather than silently
      # weakening coverage.
      - name: porffor alpha 19 (release, pinned)
        env:
          PORFFOR_RELEASE: alpha-19
          PORFFOR_REV: 0c135ce2f36fdd3467d5a58daa92283810705a51
        run: |
          curl -fsSL https://porffor.dev/install.sh | sh -s -- "$PORFFOR_RELEASE"
          test -x "$HOME/.local/bin/porf"
          "$HOME/.local/bin/porf" --version | grep -q "${PORFFOR_REV:0:7}"
          echo "PORF_BIN=$HOME/.local/bin/porf" >> "$GITHUB_ENV"
      - name: expose toolchains on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: install Perry 0.5.1520
        run: |
          npm install --global @perryts/perry@0.5.1520
          echo "PERRY_BIN=$(command -v perry)" >> "$GITHUB_ENV"
          echo "PERRY_NO_UPDATE_CHECK=1" >> "$GITHUB_ENV"
          echo "PERRY_UPDATE_MODE=off" >> "$GITHUB_ENV"
          perry --version
      - name: install scriptc 0.4.6
        run: |
          npm install --global scriptc@0.4.6
          echo "SCRIPTC_BIN=$(command -v scriptc)" >> "$GITHUB_ENV"
          scriptc --version
      - name: install TypeScriptCompiler pre-alpha87
        run: |
          sudo apt-get install -y clang libcurl4-openssl-dev
          curl -fsSL -o "$RUNNER_TEMP/tslang.tar.gz" https://github.com/ASDAlexander77/TypeScriptCompiler/releases/download/v0.0-pre-alpha87/tslang-v0.0-pre-alpha87-ubuntu-24.04-x64.tar.gz
          echo "e1b0cbb0f7325326a2aa83921cd96d3c0a5850321b68f97cc7d9c76b8b3f13a7  $RUNNER_TEMP/tslang.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tslang"
          tar xzf "$RUNNER_TEMP/tslang.tar.gz" -C "$RUNNER_TEMP/tslang"
          for var in GC_LIB_PATH TSLANG_LIB_PATH DEFAULT_LIB_PATH; do
            echo "$var=$RUNNER_TEMP/tslang" >> "$GITHUB_ENV"
          done
          echo "TSLANG_BIN=$RUNNER_TEMP/tslang/tslang" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/tslang/tslang" --version
      # QuickJS-NG's WASI build, the engine module the qjs-wasi lane runs under node.
      - name: install QuickJS-NG v0.17.0 (qjs-wasi.wasm)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qjs-wasi.wasm" https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-wasi.wasm
          echo "42a732a676ec2d93488c19411e0fad283bf72658fdad746f089914b523c783b1  $RUNNER_TEMP/qjs-wasi.wasm" | sha256sum -c -
          echo "QJS_WASI=$RUNNER_TEMP/qjs-wasi.wasm" >> "$GITHUB_ENV"
      # MoonBit, a wasm rival of the chart (bench/bench.svg). Measurement jobs only:
      # the gate's test/bench.js does not time it. The release tarball is checked
      # by its published SHA-256; the core library is pinned by the same version.
      - name: install MoonBit 0.10.19
        if: matrix.kind == 'shard'
        env:
          MOONBIT: 0.10.19+97801ee1b
        run: |
          v="${MOONBIT//+/%2B}" moon="$HOME/.moon"
          curl -fsSL -o "$RUNNER_TEMP/moonbit.tar.gz" "https://cli.moonbitlang.com/binaries/$v/moonbit-linux-x86_64.tar.gz"
          echo "b0feaf5b4a8d9f85b177e6cd7eee22aafc426dd72e84c021b75c8fff703da17f  $RUNNER_TEMP/moonbit.tar.gz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/moonbit-core.tar.gz" "https://cli.moonbitlang.com/cores/core-$v.tar.gz"
          mkdir -p "$moon/lib"
          tar xzf "$RUNNER_TEMP/moonbit.tar.gz" -C "$moon"
          tar xzf "$RUNNER_TEMP/moonbit-core.tar.gz" -C "$moon/lib"
          chmod +x "$moon"/bin/* "$moon"/bin/internal/*
          PATH="$moon/bin:$PATH" moon -C "$moon/lib/core" bundle --warn-list -a --all
          echo "$moon/bin" >> "$GITHUB_PATH"
          "$moon/bin/moonc" -v | grep -q "v${MOONBIT}"
      # Goose, a native contender run on hand ports (bench/<case>/<case>.goose).
      # Measurement jobs only, like MoonBit. The release archive is checked by its
      # published SHA-256; bench.mjs records its tag from the directory it unpacks
      # to. `goose build` compiles the C it emits with the first C compiler it
      # finds (`goose toolchain` prints which) at -O2; the smoke proves that path.
      - name: install Goose v2026.3
        if: matrix.kind == 'shard'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/goose.tar.gz" https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz
          echo "06ac30284338269d3996d457412bf4f2b47c1f9a5601de65b6317187fe78d5c9  $RUNNER_TEMP/goose.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/goose.tar.gz" -C "$RUNNER_TEMP"
          goose="$RUNNER_TEMP/goose-v2026.3-linux-x64/goose"
          echo "GOOSE_BIN=$goose" >> "$GITHUB_ENV"
          "$goose" version
          "$goose" toolchain
          printf 'fn main() {\n    print("goose ready");\n}\n' > "$RUNNER_TEMP/goose-smoke.goose"
          GOOSE_HOME="$RUNNER_TEMP/goose-smoke-home" "$goose" build "$RUNNER_TEMP/goose-smoke.goose" -o "$RUNNER_TEMP/goose-smoke"
          test "$("$RUNNER_TEMP/goose-smoke")" = 'goose ready'
      # Bend 2, a native contender run on hand ports (bench/<case>/<case>.bend).
      # Measurement jobs only, like Goose. The release archive is checked by its
      # published SHA-256 and runs where it unpacks: bin/bend reads its Base
      # library from bend2/ beside it. `bend <file> -o <bin>` builds the C it
      # emits with the first clang 14 or newer it finds (the apt clang above), at
      # -O3; the smoke proves that path and the one-core flags the bench passes.
      - name: install Bend 2.0.39
        if: matrix.kind == 'shard'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bend.tar.gz" https://github.com/bendlang/bend/releases/download/v2.0.39/bend-2.0.39-linux-x64.tar.gz
          echo "6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP"
          bend="$RUNNER_TEMP/bend/bin/bend"
          echo "BEND_BIN=$bend" >> "$GITHUB_ENV"
          test "$("$bend" version)" = 'bend 2.0.39'
          printf 'import Base\n\ndef main() -> IO(Unit):\n  do IO<Unit>:\n    IO.print("bend ready")\n' > "$RUNNER_TEMP/bend-smoke.bend"
          "$bend" "$RUNNER_TEMP/bend-smoke.bend" -o "$RUNNER_TEMP/bend-smoke"
          test "$("$RUNNER_TEMP/bend-smoke" +RTS --threads 1 --gpu off -RTS)" = 'bend ready'
      # Static Hermes has no release: build the pinned static_h source, cached by
      # the installer that pins it (shermes records its absolute paths at build).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/shermes
          key: shermes-${{ runner.os }}-${{ hashFiles('scripts/install-shermes.mjs') }}
      - name: build Static Hermes (pinned source)
        run: |
          [ -x "$RUNNER_TEMP/shermes/shermes" ] || node scripts/install-shermes.mjs "$RUNNER_TEMP/shermes"
          echo "SHERMES_BIN=$RUNNER_TEMP/shermes/shermes" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/shermes/shermes" --version
      - name: native compiler installation smoke
        run: |
          printf 'console.log("scriptc ready");\n' > "$RUNNER_TEMP/scriptc-smoke.ts"
          "$SCRIPTC_BIN" build "$RUNNER_TEMP/scriptc-smoke.ts" -o "$RUNNER_TEMP/scriptc-smoke"
          test "$("$RUNNER_TEMP/scriptc-smoke")" = 'scriptc ready'
          printf 'declare function jz_bench_now(): number;\nconst performance = { now: () => jz_bench_now() };\nconst main = () => { print(performance.now() > 0 ? "tslang ready" : "bad clock"); };\nmain();\n' > "$RUNNER_TEMP/tslang-smoke.ts"
          clang -O2 -fPIC -c bench/_lib/tslang-clock.c -o "$RUNNER_TEMP/tslang-clock.o"
          "$TSLANG_BIN" --emit=exe --opt --opt_level=3 --relocation-model=pic --obj="$RUNNER_TEMP/tslang-clock.o" "$RUNNER_TEMP/tslang-smoke.ts" -o "$RUNNER_TEMP/tslang-smoke"
          test "$("$RUNNER_TEMP/tslang-smoke")" = 'tslang ready'
          printf 'print("shermes ready");\n' > "$RUNNER_TEMP/shermes-smoke.js"
          "$SHERMES_BIN" -O "$RUNNER_TEMP/shermes-smoke.js" -o "$RUNNER_TEMP/shermes-smoke"
          test "$("$RUNNER_TEMP/shermes-smoke")" = 'shermes ready'
      - name: versions
        run: |
          node --version
          asc --version || true
          "$PORF_BIN" --version
          "$PERRY_BIN" --version
          wasm-opt --version || true
      - name: Perry native smoke (checksum-verified)
        run: |
          node bench/bench.mjs --targets=perry --cases=alpha --json="$RUNNER_TEMP/perry-smoke.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const r = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/perry-smoke.json`, 'utf8'))
          const row = r.cases.alpha?.targets.perry
          if (row?.parity !== 'ok' || !(row.medianUs > 0) || !(row.bytes > 0))
            throw new Error(`Perry smoke failed: ${JSON.stringify(row)}`)
          JS
      - name: install wasm2c (wabt prebuilt)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wabt.tar.gz" https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-linux-x64.tar.gz
          tar xzf "$RUNNER_TEMP/wabt.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/wabt-1.0.41/bin/wasm2c --version
          echo "$RUNNER_TEMP/wabt-1.0.41/bin" >> "$GITHUB_PATH"
          echo "WABT_W2C_DIR=$RUNNER_TEMP/wabt-1.0.41/share/wabt/wasm2c" >> "$GITHUB_ENV"

      # ── gate ───────────────────────────────────────────────────────────────
      - run: npm run test:bench
        if: matrix.kind == 'gate'
      # scripts/native/compile.mjs builds a Native Messaging host and every WASI
      # import through wasm2c + clang; output must match node and wasmtime byte
      # for byte. The test workflow has no WABT and skips these.
      - name: native executable (scripts/native/compile.mjs)
        if: matrix.kind == 'gate'
        run: node test/index.js native-lowering
      # ── native-lane smoke gate (audit-#12 step 4) ──────────────────────────
      # This proves both native translators still (a) build, (b) run, (c) match
      # jz's own checksum on a few representative cases — the regression a
      # translator-side codegen bug (like audit-#12's wasm2c `return_call`
      # opcode-0x12 defect) would trip. nqueens is that exact repro case, kept
      # in the smoke set as a permanent regression guard for it.
      - name: install w2c2 (build from source — no prebuilt/package exists)
        if: matrix.kind == 'gate'
        run: |
          mkdir "$RUNNER_TEMP/w2c2"
          curl -fsSL https://codeload.github.com/turbolent/w2c2/tar.gz/700f556539ea7c7995e6645b9b80e3edf9c9b271 | tar xz --strip-components=1 -C "$RUNNER_TEMP/w2c2"
          cmake -B "$RUNNER_TEMP/w2c2/w2c2/build" "$RUNNER_TEMP/w2c2/w2c2"
          cmake --build "$RUNNER_TEMP/w2c2/w2c2/build" --target w2c2 -j
          "$RUNNER_TEMP/w2c2/w2c2/build/w2c2" -h
      - name: native-lane smoke (jz-w2c + jz-w2c2, checksum-verified)
        if: matrix.kind == 'gate'
        env:
          WABT_W2C_DIR: ${{ runner.temp }}/wabt-1.0.41/share/wabt/wasm2c
          W2C2_DIR: ${{ runner.temp }}/w2c2/w2c2
          W2C2_BIN: ${{ runner.temp }}/w2c2/w2c2/build/w2c2
        run: |
          export PATH="$RUNNER_TEMP/wabt-1.0.41/bin:$PATH"
          node bench/bench.mjs --targets=jz-w2c,jz-w2c2 --cases=nqueens,wordcount --json="$RUNNER_TEMP/native-smoke.json" || exit 1
          # tokenizer now emits multi-value functions, which only WABT supports.
          node bench/bench.mjs --targets=jz-w2c --cases=tokenizer --json="$RUNNER_TEMP/native-multivalue-smoke.json" || exit 1
          node -e '
            let bad = [];
            for (const [file, ids, targets] of [
              ["native-smoke.json", ["nqueens", "wordcount"], ["jz-w2c", "jz-w2c2"]],
              ["native-multivalue-smoke.json", ["tokenizer"], ["jz-w2c"]],
            ]) {
              const r = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/" + file, "utf8"));
              for (const id of ids) for (const tid of targets) {
                const t = r.cases?.[id]?.targets?.[tid];
                if (!t) { bad.push(`${id}/${tid}: missing`); continue; }
                if (t.status === "fail") { bad.push(`${id}/${tid}: FAIL — ${t.reason}`); continue; }
                if (t.parity !== "ok") bad.push(`${id}/${tid}: parity=${t.parity}`);
              }
            }
            if (bad.length) { console.error("native-lane smoke FAILED:\n" + bad.join("\n")); process.exit(1); }
            console.log("native-lane smoke OK — both translators match checksums; WABT also passes multi-value returns");
          '

      # ── shard ──────────────────────────────────────────────────────────────
      # This job's cases, every lane, on this one machine: the claim lanes in
      # alternating paired rounds for a reference run, every other lane once.
      # A lane that exhausts memory must cost its own row, not the runner (run
      # 41508597936 lost one with its log and 16 cases): no swap to thrash, where
      # the runner stops answering long before the kernel acts, and the bench's
      # process tree first in the OOM killer's line, its largest member first; the
      # killed lane reads "killed by SIGKILL … (out of memory?)". memory.log keeps
      # the machine's memory, disk and largest processes every 30 s, and the kernel's
      # OOM kills, beside the shard's dataset.
      - name: measure this shard's cases
        if: matrix.kind == 'shard'
        shell: bash
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          PAIRED: ${{ needs.plan.outputs.paired }}
          PAIRED_TARGETS: ${{ needs.plan.outputs.paired-targets }}
          CASES: ${{ matrix.cases }}
        run: |
          out="$RUNNER_TEMP/shard"; mkdir -p "$out"
          sudo swapoff -a || echo '::warning::swap stays on: a memory-hungry lane may stall the runner'
          echo 1000 > /proc/self/oom_score_adj
          ( while :; do { date -u +%T; free -m | sed -n 2p; df -m / | tail -1; ps -eo rss=,etimes=,args= --sort=-rss | head -3 | cut -c1-200; } >> "$out/memory.log"; sleep 30; done ) &
          sampler=$!
          paired=(); [ "$PAIRED" != 0 ] && paired=(--paired="$PAIRED" --paired-targets="$PAIRED_TARGETS")
          set +e
          node bench/bench.mjs --targets="$TARGETS" --cases="$CASES" "${paired[@]}" --json="$out/shard.json" --no-web 2>&1 | tee "$out/shard.log"
          status=${PIPESTATUS[0]}
          kill "$sampler"
          sudo dmesg -T | grep -i -E 'out of memory|killed process' >> "$out/memory.log"
          exit "$status"
      # A rerun of this job (gh run rerun --failed) replaces the artifact it left.
      - name: retain this shard
        if: always() && matrix.kind == 'shard'
        uses: actions/upload-artifact@v4
        with:
          name: bench-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [plan, bench]
    # After every shard, failed ones included, so a refusal names what is missing.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Commits the merged dataset to main; reads the run's artifacts, every attempt's.
    permissions:
      contents: write
      actions: read
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      CASES: ${{ inputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the claims gate's freshness check reads the history behind the measured commit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node }}
      - run: npm ci --ignore-scripts
      # Through the run's API rather than this attempt's own store: after
      # `gh run rerun --failed`, the shards of the first attempt are still the run's.
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-shard-*
          path: ${{ runner.temp }}/shards
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      # One dataset or a refusal that names what is missing or inconsistent.
      - name: merge the shards
        id: merge
        shell: bash
        run: |
          file=results-ci.json; [ "$MODE" = reference ] && file=reference.json; [ -n "$CASES" ] && file=probe.json
          echo "file=$file" >> "$GITHUB_OUTPUT"
          EVIDENCE="$RUNNER_TEMP/evidence"; echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          node bench/shards.mjs merge ${CASES:+--cases=$CASES} --out="$EVIDENCE/$file" "$RUNNER_TEMP"/shards/*/shard.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: every shard job succeeded
        if: ${{ !cancelled() && needs.bench.result != 'success' }}
        env:
          RESULT: ${{ needs.bench.result }}
          RUN: ${{ github.run_id }}
        run: |
          echo "::error::a shard job ended $RESULT: nothing is published. The other shards' evidence stays with the run: gh run rerun $RUN --failed measures the failed shards again and merges them with it (bench-retry.yml does so once by itself)"
          echo "a shard job ended $RESULT: nothing published; \`gh run rerun $RUN --failed\` re-measures the failed shards and merges them with the rest" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: enforce release claims
        if: env.MODE == 'reference' && env.CASES == ''
        shell: bash
        env:
          JZ_BENCH_RESULTS: ${{ runner.temp }}/evidence/reference.json
        run: |
          set +e
          node test/bench-claims.js 2>&1 | tee "$EVIDENCE/claims.log"
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            failed=$(grep '✗' "$EVIDENCE/claims.log" | sed 's/\x1b\[[0-9;]*m//g; s/^ *✗ *//')
            { echo '### release claims failed: bench/results.json not refreshed'; echo '```'; echo "$failed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$failed" | sed 's/^/::error::/'
          fi
          exit "$status"
      - name: retain the evidence
        if: always() && steps.merge.outputs.file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODE }}-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          overwrite: true
      # pages.yml redeploys when this run completes successfully.
      - name: publish to main
        if: env.CASES == '' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          node scripts/bench-publish.mjs --mode="$MODE" --dataset="$EVIDENCE/${{ steps.merge.outputs.file }}"
      - name: not published
        if: env.CASES != '' || github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
          ARTIFACT: ${{ env.MODE }}-${{ github.sha }}
        run: |
          why="measured on $REF, not main"; [ -n "$CASES" ] && why="a probe of $CASES"
          echo "::notice::not published: $why; the evidence is the $ARTIFACT artifact"
          echo "not published: $why; the evidence is the $ARTIFACT artifact" >> "$GITHUB_STEP_SUMMARY"
