name: test
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# No job runs past an hour: a job that would is cut over more machines.
#
# The core and generated legs are cut over machines (`npm test -- --slice=<i>/<n>`,
# test/index.js): the leg's files, a ring turned by the commit, in n contiguous arcs of
# near-equal recorded CPU seconds (test/native-costs.json), each arc split over the
# runner's cores as `npm test` splits the whole. test/test-infrastructure.js holds that a
# leg's slices are disjoint and together run its every file.
#
# Limits, from run 44340739961 (86df52211, the whole of each leg on one 4-core runner, three
# processes): the core took 111 min at the default level, 105 at level 3, 59 on WASI and 19 at
# level 0 (two processes); the generated suite 56 min and on WASI 70. A process there spent
# 1.84 wall seconds a CPU second the table records on the default leg (1.65 to 2.01 a run),
# 1.53 at level 3 (against the armed row), 1.07 on WASI, 1.08 at level 0, 1.12 on the
# generated suite and 1.34 on its WASI leg (against the default row). At 2 seconds a second,
# the dearest process of a slice over every seed comes to about 43 min for each core leg cut
# in 3 (1,290 recorded seconds), 20 for level 0 whole (609), and 52 for the generated suite
# cut in 2 (1,568; at its own rates 29 to 35), where store-population alone holds a process
# 1,215 s. The hour is each job's limit.
jobs:
  # The source checks, the examples' build and the public types: no suite leg.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - name: check source cleanup
        run: npm run lint:imports && npm run audit:files
      # Smoke test: every example still compiles. Output wasm is built + deployed by
      # pages.yml (not committed), so there's no drift gate — just confirm they build.
      - run: npm run build:examples
      # Public declarations are release code: type-check every exported subpath.
      - run: npm run test:types

  test:
    name: core (${{ matrix.variant }}) ${{ matrix.slice }}/${{ matrix.slices }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Core suite under every compiler configuration: default = level 2,
        # opt0/opt3 the level extremes, wasi the standalone host. Level- and
        # host-specific assertions are guarded by belowOpt()/onWasi() in
        # test/_matrix.js, so all legs are green — a miscompile that only surfaces
        # at opt0 or under wasi is caught in CI, not just locally. opt1 (light size
        # passes only) is omitted as low-signal between opt0 and opt2 — the fuzz
        # job below still exercises opt1 numerically; `npm run test:opt1` runs it
        # ad-hoc.
        include:
          - { variant: default, slice: 1, slices: 3 }
          - { variant: default, slice: 2, slices: 3 }
          - { variant: default, slice: 3, slices: 3 }
          - { variant: opt0, slice: 1, slices: 1 }
          - { variant: opt3, slice: 1, slices: 3 }
          - { variant: opt3, slice: 2, slices: 3 }
          - { variant: opt3, slice: 3, slices: 3 }
          - { variant: wasi, slice: 1, slices: 3 }
          - { variant: wasi, slice: 2, slices: 3 }
          - { variant: wasi, slice: 3, slices: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - name: core (${{ matrix.variant }}), slice ${{ matrix.slice }} of ${{ matrix.slices }}
        run: |
          # The whole suite in one process runs weekly (one-process.yml).
          case "${{ matrix.variant }}" in
            opt0) export JZ_TEST_OPTIMIZE=0 ;;
            opt3) export JZ_TEST_OPTIMIZE=3 ;;
            wasi) export JZ_TEST_HOST=wasi ;;
          esac
          npm test -- --slice=${{ matrix.slice }}/${{ matrix.slices }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [default, opt0, opt3, wasi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - name: integration (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            opt0) export JZ_TEST_OPTIMIZE=0 ;;
            opt3) export JZ_TEST_OPTIMIZE=3 ;;
            wasi) export JZ_TEST_HOST=wasi ;;
          esac
          npm run test:integration
      # The default integration leg's web-smoke builds the browser dist; no
      # bootstrap compiler is needed to pack the published JavaScript package.
      - name: verify the published package installs and runs
        if: matrix.variant == 'default'
        run: |
          package_tarball=$(npm pack --ignore-scripts --silent)
          smoke_dir="$RUNNER_TEMP/jz-package-smoke"
          npm install --prefix "$smoke_dir" --ignore-scripts "$PWD/$package_tarball"
          cd "$smoke_dir"
          node --input-type=module -e 'import jz from "jz"; import "jz/interop"; if (jz("export let f = () => 42").exports.f() !== 42) throw Error("package compile failed")'

  # These files own their optimize sweeps; both hosts, whole, cut as the core is.
  generated:
    name: generated (${{ matrix.variant }}) ${{ matrix.slice }}/${{ matrix.slices }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: default, slice: 1, slices: 2 }
          - { variant: default, slice: 2, slices: 2 }
          - { variant: wasi, slice: 1, slices: 2 }
          - { variant: wasi, slice: 2, slices: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - name: generated (${{ matrix.variant }}), slice ${{ matrix.slice }} of ${{ matrix.slices }}
        run: |
          if [ "${{ matrix.variant }}" = wasi ]; then export JZ_TEST_HOST=wasi; fi
          npm run test:generated -- --slice=${{ matrix.slice }}/${{ matrix.slices }}

  # Extended differential fuzz: `npm test`'s in-suite `fuzz` test gates only seeds
  # 1..200; this runs the full 5000-seed pass (jz-wasm vs JS at opt {0,1,2,3},
  # contract-aware oracle that skips inputs exceeding jz's documented i32 range,
  # shrinking on mismatch) so a miscompile on a shape the curated suite misses is
  # caught in CI. ~4 min.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      # JZ_DEBUG_INVARIANTS=1 turns on the per-phase structural checks (ctx
      # invariants + verifyFn on optimizer output) so a malformed-IR bug surfaces
      # as a localized "[ir verify] … in $fn: duplicate local $x" here instead of
      # an opaque watr error. ~free on this job; not on by default (no per-compile
      # tax for library users — watr is the production backstop).
      - run: npm run test:fuzz
        env:
          JZ_DEBUG_INVARIANTS: '1'

  # Committed-evidence claims gate (audit 2026-07-27: wired to CI, not only
  # prepublishOnly). HONESTLY RED until the reference dataset is fresh,
  # complete (every rival contested), and winning (strict + band) — the red is
  # the point: the claim cannot silently regress or silently ship.
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # the held-out lane's tests bundle its fixture's drivers
      - run: npm rebuild esbuild
      - run: node test/bench-claims.js
