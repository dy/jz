name: bench-probe
# Diagnostic, manual-only: repeated paired medians for selected cases on the
# CI runner. Separates shared-runner noise from systematic x86/µarch gaps when
# a case's lead differs from the reference M4 numbers (wordcount/immutable/
# shapes flipped to losses on the 07-14 EPYC snapshot while dispatch/strbuild
# kept 2.5× leads on the same run — noise degrades everything, µarch picks
# favorites). Prints paired measurements and uploads the JSON with machine metadata.
# Diagnostic evidence only; this workflow does not update committed results.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: comma-separated case ids
        default: wordcount,immutable,shapes,dispatch,hash
      repeats:
        description: alternating rounds
        default: '5'
      targets:
        description: comma-separated targets
        default: jz,v8,bun,jsc,c-wasm,rust-wasm,as
      base:
        description: commit to measure beside this tree as jz-base (A/B on one machine)
        default: ''
      node_flags:
        description: node flag sets, ';'-separated (an empty set is the default), each run on jz's wasm and on V8's JS in alternating fresh processes after the paired rounds
        default: ''
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      JZ_BENCH_BUILD_DIR: ${{ github.workspace }}/../jz-bench
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      # The base compiler runs from its own checkout against this tree's
      # installed dependencies; both builds are timed in alternating rounds.
      - name: check out the A/B base
        if: ${{ inputs.base != '' }}
        env:
          BASE: ${{ inputs.base }}
        run: |
          git worktree add "$RUNNER_TEMP/jz-base" "$BASE"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/jz-base/node_modules"
          echo "JZ_BASE_ROOT=$RUNNER_TEMP/jz-base" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: install JavaScriptCore
        run: |
          npx --yes jsvu --engines=javascriptcore --os=linux64
          echo "$HOME/.jsvu/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: rustup target add wasm32-wasip1
      - run: npm install --ignore-scripts --no-save assemblyscript@~0.27.0 binaryen
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: machine
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc; free -m | head -2
      - name: probe rounds
        env:
          CASES: ${{ inputs.cases }}
          REPEATS: ${{ inputs.repeats }}
          TARGETS: ${{ inputs.targets }}
        run: |
          [ -n "$JZ_BASE_ROOT" ] && TARGETS="${TARGETS/jz,/jz,jz-base,}"
          node bench/bench.mjs --cases="$CASES" --targets="$TARGETS" --paired="$REPEATS" --json="$RUNNER_TEMP/probe.json"
      # The same built modules under other node flags: how much of a case's
      # ratio is the engine's tiering (--no-liftoff, --v8-pool-size) and not code.
      - name: flag rounds
        if: ${{ inputs.node_flags != '' }}
        env:
          CASES: ${{ inputs.cases }}
          REPEATS: ${{ inputs.repeats }}
          FLAGS: ${{ inputs.node_flags }}
        run: |
          cat > "$RUNNER_TEMP/flags.mjs" <<'JS'
          import { execFileSync } from 'node:child_process'
          import { join } from 'node:path'
          const [cases, rounds, sets] = [process.env.CASES.split(','), +process.env.REPEATS * 2, process.env.FLAGS.split(';')]
          const med = a => [...a].sort((x, y) => x - y)[a.length >> 1]
          const time = (flags, args) => +execFileSync('node', [...flags, ...args], { encoding: 'utf8', maxBuffer: 1 << 26 }).match(/median_us=([\d.]+)/)[1]
          for (const id of cases) {
            const lanes = { jz: ['bench/_lib/run-jz-host.mjs', join(process.env.JZ_BENCH_BUILD_DIR, id, `${id}-host.wasm`)], v8: ['bench/_lib/run-v8.mjs', `bench/${id}/${id}.js`] }
            const runs = sets.map(set => ({ set: set || '(default)', flags: set.split(' ').filter(Boolean), jz: [], v8: [] }))
            for (let r = 0; r < rounds; r++) for (const run of r % 2 ? [...runs].reverse() : runs)
              for (const lane of r % 2 ? ['v8', 'jz'] : ['jz', 'v8']) run[lane].push(time(run.flags, lanes[lane]))
            for (const run of runs) console.log(`${id} ${run.set.padEnd(24)} jz ${med(run.jz).toFixed(0).padStart(7)} µs  v8 ${med(run.v8).toFixed(0).padStart(7)} µs  jz/v8 ${med(run.jz.map((t, i) => t / run.v8[i])).toFixed(3)}  jz/jz-default ${(med(run.jz) / med(runs[0].jz)).toFixed(3)}  [jz ${run.jz.join(' ')}] [v8 ${run.v8.join(' ')}]`)
          }
          JS
          node "$RUNNER_TEMP/flags.mjs" | tee "$RUNNER_TEMP/flags.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-probe
          path: |
            ${{ runner.temp }}/probe.json
            ${{ runner.temp }}/flags.log
          if-no-files-found: error
