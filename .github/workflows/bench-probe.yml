name: bench-probe
# Diagnostic, manual-only: repeated jz-vs-V8 medians for selected cases on the
# CI runner. Separates shared-runner noise from systematic x86/µarch gaps when
# a case's lead differs from the reference M4 numbers (wordcount/immutable/
# shapes flipped to losses on the 07-14 EPYC snapshot while dispatch/strbuild
# kept 2.5× leads on the same run — noise degrades everything, µarch picks
# favorites). Prints paired measurements and uploads the JSON with machine metadata.
# Diagnostic evidence only; this workflow does not update committed results.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: comma-separated case ids
        default: wordcount,immutable,shapes,dispatch,hash
      repeats:
        description: alternating rounds
        default: '5'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: machine
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc; free -m | head -2
      - name: probe rounds
        env:
          CASES: ${{ inputs.cases }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          node bench/bench.mjs --cases="$CASES" --targets=jz,v8 --paired="$REPEATS" --json="$RUNNER_TEMP/probe.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-probe
          path: ${{ runner.temp }}/probe.json
          if-no-files-found: error
