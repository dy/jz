name: test262
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.html'
      - '.work/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
jobs:
  test262-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test262.js's own PINNED_COMMIT const clones (or re-pins an existing
      # checkout to) the exact tc39/test262 SHA the baselines below were
      # measured against — no separate clone step needed. The cache just saves
      # the network round-trip; bump the key's version suffix whenever
      # PINNED_COMMIT moves so a stale cached checkout can't shadow the pin.
      - name: Cache test262 corpus
        id: cache-test262
        uses: actions/cache@v4
        with:
          path: test/test262
          key: test262-pinned-v1
      - name: Run test262 language suite
        env:
          # Baseline (2026-05-29): 1437 passes / 0 in-scope fails / 3 xfail / 21940 skips.
          # The runner gates on THREE guards: in-scope fail===0 (any fail is a
          # miscompile), xpass===0 (prune stale EXPECTED_FAIL entries), and this
          # pass-count ratchet. Out-of-scope gaps bucket as xfail (see EXPECTED_FAIL
          # in test/test262.js), not fail. 2026-05-29: +9 — subscript 10.4.17 fixed
          # the `1.e3` digit-dot-exponent lexer (8 numeric + 1 computed-key literal).
          # 2026-07-10: 1453 → 2205 — the unblanketing leg: stale blankets removed
          # (for-of dir, destructuring content, this/class/super/WeakMap/new.target
          # patterns), four real compiler fixes surfaced+landed (destructuring
          # defaults fired on null; numeric object-pattern keys crashed; `var`
          # pattern declarators dropped; for-of head cover-grammar `{x=1}`
          # mis-destructured), residues precisely skip-classified or xfail-tracked
          # (bool-carrier family flips to xpass when that work lands — prune then).
          # 2026-07-14: 2972 → 2975 — undeclared for-in binder declared at the
          # prepare lowering (structural write-only mint; a general emit-side
          # write-legalization regressed 50 ReferenceError pins and was removed).
          JZ_TEST262_BASELINE: 2975
        run: npm run test:262

  test262-builtins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache test262 corpus
        id: cache-test262
        uses: actions/cache@v4
        with:
          path: test/test262
          key: test262-pinned-v1
      # Baseline lives in test/test262-baseline.json (audit-#11 item 7 sub-3) —
      # both this job and a local `npm run test:262:builtins` read it, so
      # there's one number to bump instead of two. JZ_TEST262_BASELINE can
      # still override it for a one-off CI diagnostic run.
      - name: Run test262 built-ins suite
        run: npm run test:262:builtins
