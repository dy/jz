name: bench-retry
# A measurement run of bench.yml (schedule or dispatch) whose shard job failed is
# rerun once, failed jobs only: the failed shards are measured again on fresh
# runners and the publish job merges them with the shards that succeeded, whose
# artifacts stay with the run. A runner lost mid-shard leaves no artifact; that
# is the failure this repairs without anyone's hand. A second failure stays red.
on:
  workflow_run:
    workflows: [bench]
    types: [completed]
permissions:
  actions: write
jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: rerun the failed shards
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select((.name | test(" shard [0-9]+:")) and .conclusion != "success")] | length')
          if [ "$failed" = 0 ]; then
            echo "run $RUN failed with every shard measured: not a lost shard, nothing to rerun"
            exit 0
          fi
          echo "run $RUN lost $failed shard job(s): rerunning its failed jobs"
          gh run rerun "$RUN" --failed -R "$REPO"
