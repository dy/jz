name: heldout
# The held-out lane (bench/heldout/manifest.json): programs jz was never tuned on, fetched
# here at their pinned commits (each file checked against its blob id) and run through a
# driver generated by scripts/heldout.mjs (bundled by esbuild, nothing rewritten). By hand only.
#   dry: V8 alone runs every driver and each set's own check; jz is not built. The
#     harness is debugged here, as often as needed: no result of jz's is seen.
#   contact: jz at 'speed' and exact beside V8, Deno, Bun, JSC and Porffor, each program's
#     oracle V8's result of the unmodified source, in paired rounds. On main only: the
#     record (bench/heldout.json) is committed by the record job, and a program is
#     measured on first contact once.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry runs V8 alone and builds no jz; contact measures every lane and commits the record
        type: choice
        options: [dry, contact]
        default: dry
      sets:
        description: Sets to run, comma-separated (empty runs every set of the manifest)
        type: string
        default: ''
# One run at a time: a contact's record is built on the one before it.
concurrency:
  group: heldout
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sets: ${{ steps.sets.outputs.sets }}
    env:
      MODE: ${{ inputs.mode }}
      SETS: ${{ inputs.sets }}
    steps:
      - uses: actions/checkout@v4
      - id: sets
        run: |
          if [ "$MODE" = contact ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a contact run measures each program once, so it runs on main alone, where its record is committed"
            exit 1
          fi
          node -e '
            const m = require("./bench/heldout/manifest.json"), want = process.argv[1] ? process.argv[1].split(",") : m.sets.map(s => s.id)
            const bad = want.filter(id => !m.sets.some(s => s.id === id))
            if (bad.length) { console.error(`no set ${bad.join(", ")} in bench/heldout/manifest.json`); process.exit(1) }
            console.log(`sets=${JSON.stringify(want)}`)' "$SETS" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    name: ${{ inputs.mode }} ${{ matrix.set }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.sets) }}
    # The measuring job writes nothing to the repository; the record job does.
    permissions:
      contents: read
    env:
      MODE: ${{ inputs.mode }}
      SET: ${{ matrix.set }}
    steps:
      # Full history: a program's registration is read from the manifest's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - name: fetch the pinned files
        run: node scripts/heldout.mjs fetch "$RUNNER_TEMP/heldout/src" --sets="$SET"
      - name: generate the drivers
        run: node scripts/heldout.mjs generate "$RUNNER_TEMP/heldout/src" "$RUNNER_TEMP/heldout/cases" --sets="$SET"
      # A dry run fails on a program V8 does not run or the set's check does not pass;
      # a contact run records it (its rows unverified) and measures the rest.
      - name: V8 runs every driver and the set's own check
        run: node scripts/heldout.mjs check "$RUNNER_TEMP/heldout/cases" "$RUNNER_TEMP/heldout/src" --sets="$SET" || test "$MODE" = contact
      - name: refuse a program registered under another compiler
        if: inputs.mode == 'contact'
        run: node scripts/heldout.mjs registered "$RUNNER_TEMP/heldout/cases" --sets="$SET"
      - uses: denoland/setup-deno@v2
        if: inputs.mode == 'contact'
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        if: inputs.mode == 'contact'
      - name: install jsc (JavaScriptCore), the latest Linux build
        if: inputs.mode == 'contact'
        run: |
          JSC=$(curl -fsSL https://webkitgtk.org/jsc-built-products/x86_64/release/LAST-IS | grep -o '^[0-9]*')
          npx --yes jsvu --os=linux64 "javascriptcore@$JSC"
          "$HOME/.jsvu/bin/jsc-$JSC" -e 'print("jsc ready")' | grep -q 'jsc ready'
          echo "JSC_BIN=$HOME/.jsvu/bin/jsc-$JSC" >> "$GITHUB_ENV"
      # The release bench.yml measures (alpha 23, a97a0ae).
      - name: porffor alpha 23 (release, pinned)
        if: inputs.mode == 'contact'
        env:
          PORFFOR_RELEASE: alpha-23
          PORFFOR_REV: a97a0ae8e296009aee482dff11b150528098a9b7
        run: |
          curl -fsSL https://porffor.dev/install.sh | sh -s -- "$PORFFOR_RELEASE"
          test -x "$HOME/.local/bin/porf"
          "$HOME/.local/bin/porf" --version | grep -q "${PORFFOR_REV:0:7}"
          echo "PORF_BIN=$HOME/.local/bin/porf" >> "$GITHUB_ENV"
      - name: install GNU time (peak RSS) and clang (Porffor's C backend)
        if: inputs.mode == 'contact'
        run: sudo apt-get update && sudo apt-get install -y time clang
      - name: measure every lane, the claim lanes' paired rounds
        if: inputs.mode == 'contact'
        env:
          JZ_BENCH_CASES_DIR: ${{ runner.temp }}/heldout/cases
          JZ_BENCH_ORACLE: source
          JZ_BENCH_BUILD_DIR: ${{ runner.temp }}/heldout/build
        run: node bench/bench.mjs --targets=jz,jz-exact,v8,deno,bun,jsc,porf-native --paired=6 --no-web --json="$RUNNER_TEMP/heldout/bench.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: heldout-${{ matrix.set }}
          path: |
            ${{ runner.temp }}/heldout/cases/index.json
            ${{ runner.temp }}/heldout/cases/check.json
            ${{ runner.temp }}/heldout/bench.json
          if-no-files-found: ignore

  record:
    needs: [plan, run]
    # every set's job, failed ones included: a set measured whole is recorded, one that is
    # not leaves its programs unmeasured
    if: ${{ !cancelled() && inputs.mode == 'contact' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      SETS: ${{ join(fromJSON(needs.plan.outputs.sets), ' ') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: heldout-*
          path: ${{ runner.temp }}/runs
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: append each set's entries to the record on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          missing=0
          for set in $SETS; do
            run="$RUNNER_TEMP/runs/heldout-$set"
            if [ ! -f "$run/bench.json" ]; then echo "::error::$set: no measurement, its programs stay unmeasured"; missing=1; continue; fi
            node scripts/heldout.mjs record "$run/cases" "$run/bench.json" --publish
          done
          exit $missing
