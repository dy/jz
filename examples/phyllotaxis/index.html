<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Phyllotaxis - jz</title>
<meta name="description" content="Seeds at the golden angle — a hair off 137.5° breaks the sunflower. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/phyllotaxis/" />
<meta property="og:title" content="Phyllotaxis - jz" />
<meta property="og:description" content="Seeds at the golden angle — a hair off 137.5° breaks the sunflower. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/phyllotaxis/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/phyllotaxis.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo, trackPointer } from "../lib/jzdemo.js"

const GOLDEN_ANGLE = 2.3999632297286535
let baseAng = GOLDEN_ANGLE, userSet = false, count = 3600, gap = 1.0   // re-roll varies count + gap
const demo = runDemo({
  name: "phyllotaxis",
  hint: "Sunflower packing — drag left/right to shift the divergence angle away from golden",
  frame: (e, t) => {
    let ang
    if (ptr.down) {
      // an ULTRA-FINE slider: the whole screen width spans only ±0.006rad around golden — the
      // packing reorganizes dramatically within a hair of the golden angle, so even a fine sweep
      // blew past every interesting parastichy. Drag slowly to walk the spiral families one by one.
      ang = GOLDEN_ANGLE + (ptr.x - 0.5) * 0.0125
      baseAng = ang; userSet = true
    } else {
      const amp = userSet ? 0.001 : 0.005
      ang = baseAng + Math.sin(t * 0.02) * amp         // slow, gentle drift (4× softer)
    }
    e.frame(t, ang, count, gap)
  },
  // re-roll: a fresh density — vary the seed count and the dot/gap ratio
  randomize: () => { count = Math.round(900 + Math.random() * 5200); gap = 0.7 + Math.random() * 1.1 },
})
const ptr = trackPointer(demo.cv)
</script>
</body>
</html>
