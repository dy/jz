<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Apollonian Gasket - jz</title>
<meta name="description" content="Descartes' circle theorem packs circles within circles, forever. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/apollonian/" />
<meta property="og:title" content="Apollonian Gasket - jz" />
<meta property="og:description" content="Descartes' circle theorem packs circles within circles, forever. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/apollonian/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/apollonian.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo, trackPointer } from "../lib/jzdemo.js"

let panX = 0.0, panY = 0.0, zoom = 1.0
let lastPx = 0, lastPy = 0
const demo = runDemo({
  name: "apollonian",
  hint: "Apollonian gasket — drag to pan, scroll to zoom",
  frame: (e, t) => {
    // ptr.x/y are already normalized to the canvas (0..1), and the kernel maps panX→panX·W
    // pixels — so a drag delta IS the pan delta, 1:1 in screen space. (The old code divided by
    // innerWidth again, shrinking every drag ~1000×, which is why panning looked dead.)
    if (ptr.down) {
      panX += (ptr.x - lastPx)
      panY += (ptr.y - lastPy)
    }
    lastPx = ptr.x; lastPy = ptr.y
    e.frame(t, panX, panY, zoom)
  },
})
const ptr = trackPointer(demo.cv)

demo.cv.addEventListener("wheel", (e) => {
  e.preventDefault()
  zoom *= Math.exp(-e.deltaY * 0.001)
  if (zoom < 0.1) zoom = 0.1
  if (zoom > 20.0) zoom = 20.0
}, { passive: false })
</script>
</body>
</html>
