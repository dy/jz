<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Cloth - jz</title>
<meta name="description" content="Verlet cloth with shear bracing — grab, twist, and let the wind billow it. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/cloth/" />
<meta property="og:title" content="Cloth - jz" />
<meta property="og:description" content="Verlet cloth with shear bracing — grab, twist, and let the wind billow it. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/cloth/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/cloth.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

const demo = runDemo({
  name: "cloth",
  hint: "a spring-mass cloth — grab and swing it",
  size: { dpr: 1.5, budget: 600000 },
  bg: "#f3f1ec",
  cursor: "grab",
  frame: (e, t) => e.frame(t),
})

const sx = () => demo.W / demo.cv.clientWidth, sy = () => demo.H / demo.cv.clientHeight
let dragging = false
demo.cv.addEventListener("pointerdown", (e) => {
  if (!demo.engine) return
  dragging = true; demo.cv.style.cursor = "grabbing"
  try { demo.cv.setPointerCapture(e.pointerId) } catch {}
  demo.engine.grab(e.offsetX * sx(), e.offsetY * sy())
})
demo.cv.addEventListener("pointermove", (e) => { if (dragging && demo.engine) demo.engine.drag(e.offsetX * sx(), e.offsetY * sy()) })
demo.cv.addEventListener("pointerup", (e) => { dragging = false; demo.cv.style.cursor = "grab"; demo.engine?.release(); try { demo.cv.releasePointerCapture(e.pointerId) } catch {} })
demo.cv.addEventListener("pointerleave", () => { dragging = false; demo.cv.style.cursor = "grab"; demo.engine?.release() })
demo.cv.addEventListener("dblclick", () => demo.engine && demo.engine.init())
</script>
</body>
</html>
