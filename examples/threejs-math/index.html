<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>three.js math - jz</title>
<meta name="description" content="three.js's own math classes (Vector3, Matrix4, Frustum, Sphere), unmodified, compiled to WebAssembly with jz — a camera culls a field of spheres against the view frustum, live." />
<link rel="canonical" href="https://jz.js.org/examples/threejs-math/" />
<meta property="og:title" content="three.js math - jz" />
<meta property="og:description" content="three.js's own math classes, unmodified, compiled to WebAssembly with jz — a camera culls a field of spheres against the view frustum, live." />
<meta property="og:url" content="https://jz.js.org/examples/threejs-math/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/threejs-math.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

let dragging = false, lx = 0, ly = 0

const demo = runDemo({
  name: "threejs-math",
  hint: "drag to steer the camera through the frustum-culled field · the auto-orbit never stops",
  size: { dpr: 2, budget: 2200000 },
  load: (e) => e.init(),
  frame: (e, t) => e.frame(t),
})

demo.cv.addEventListener("pointerdown", (e) => {
  dragging = true
  lx = e.clientX; ly = e.clientY
  try { demo.cv.setPointerCapture(e.pointerId) } catch {}
})
demo.cv.addEventListener("pointermove", (e) => {
  if (!dragging) return
  const dx = e.clientX - lx, dy = e.clientY - ly
  lx = e.clientX; ly = e.clientY
  demo.engine?.look?.(dx * 0.006, dy * 0.15)
})
demo.cv.addEventListener("pointerup", (e) => { dragging = false; try { demo.cv.releasePointerCapture(e.pointerId) } catch {} })
demo.cv.addEventListener("pointerleave", () => { dragging = false })
</script>
</body>
</html>
