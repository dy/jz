<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<link rel="icon" href="https://github.com/dy/jz/favicon.ico" type="image/x-icon" />
</head>
<body>
<script type="module">
import { runDemo, trackPointer } from "../lib/jzdemo.js"

// The original Lenia's canonical O2(a) Orbium, rendered as a single grayscale density field.
// One host-owned seed keeps JS and jz on the same deterministic colony across resize/swap.
let colonySeed = (Math.random() * 2e9) | 0
let lastStep = 0

const demo = runDemo({
  name: "lenia",
  hint: "Lenia · drag to paint · right-drag to erase",
  size: { cap: 192 },
  bg: "#000",
  palette: false,
  load: (e, d) => { e.seed(colonySeed); lastStep = d.t },
  // The reference implementation advances at 20 Hz. The canvas still paints at display rate.
  frame: (e, t) => { if (t - lastStep >= 1 / 20) { lastStep = t; e.frame() } },
  randomize: (e) => {
    colonySeed = (colonySeed * 1103515245 + 12345) | 0
    e.seed(colonySeed)
  },
})

const cv = demo.cv
const ptr = trackPointer(cv)
const BRUSH = 5
let drawing = false, erasing = false, lastX = 0, lastY = 0

cv.style.touchAction = "none"
cv.addEventListener("contextmenu", (e) => e.preventDefault())

const point = () => ({
  x: Math.max(0, Math.min(demo.W - 0.001, ptr.x * demo.W)),
  y: Math.max(0, Math.min(demo.H - 0.001, ptr.y * demo.H)),
})
const stamp = (x, y) => demo.engine?.paint(x, y, BRUSH, erasing ? 1 : 0)
const stroke = (x, y) => {
  const dx = x - lastX, dy = y - lastY
  const count = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (BRUSH * 0.5)))
  for (let i = 1; i <= count; i++) stamp(lastX + dx * i / count, lastY + dy * i / count)
  lastX = x; lastY = y
}

cv.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 && e.button !== 2) return
  drawing = true
  erasing = e.button === 2
  const p = point()
  lastX = p.x; lastY = p.y
  stamp(lastX, lastY)
})
cv.addEventListener("pointermove", () => {
  if (!drawing) return
  const p = point()
  stroke(p.x, p.y)
})
const stopDrawing = () => { drawing = false }
cv.addEventListener("pointerup", stopDrawing)
cv.addEventListener("pointercancel", stopDrawing)
cv.addEventListener("lostpointercapture", stopDrawing)
</script>
</body>
</html>
