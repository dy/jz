<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Waves - jz</title>
<meta name="description" content="Rain on black water: the 2D wave equation carries every ring, and each slope mirrors the studio lights. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/waves/" />
<meta property="og:title" content="Waves - jz" />
<meta property="og:description" content="Rain on black water: the 2D wave equation carries every ring, and each slope mirrors the studio lights. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/waves/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/waves.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

// Rain on black water: drops and pointer pressure disturb the surface, the wave equation carries
// the rings, and the studio's softbox catches every slope that turns toward it. Each drop REBOUNDS —
// a damped train of rings, like real water. Click adds a drop, drag draws a stroke, scroll changes
// the relief.
let foc = 440                         // relief: how steeply the height tilts the mirror
let down = false, stick = false       // stick engages only after real movement — a clean
let sx = 0, sy = 0, dx0 = 0, dy0 = 0  // click must NOT press the stick under its own drop
let nextDrop = 0, nextRain = 0, breakTrail = false
const scheduleDrop = (t) => { nextDrop = t + 2.2 + Math.random() * 2.4 }   // a big drop every few s,
                                       // a light drizzle between them — ring families to interfere

const demo = runDemo({
  name: "waves",
  hint: "rain on black water — click to drop · drag through the surface · scroll = relief",
  size: { budget: 520000 },
  bg: "#000",
  load: (e, d) => { e.clear(); nextDrop = d.t + 0.8 },
  frame: (e, t, d) => {
    if (!down && t >= nextDrop) {
      e.drop(d.W * (0.15 + Math.random() * 0.7), d.H * (0.15 + Math.random() * 0.7))
      scheduleDrop(t)
    }
    if (!down && t >= nextRain) {
      e.rain(d.W * (0.08 + Math.random() * 0.84), d.H * (0.08 + Math.random() * 0.84))
      nextRain = t + 0.08 + Math.random() * 0.24
    }
    let active = stick ? 1.0 : 0.0
    if (breakTrail) { active = 0.0; breakTrail = false }
    e.frame(t, sx, sy, active, foc)
  },
  randomize: (e, d) => {
    scheduleDrop(d.t)
    for (let i = 0; i < 3; i++) e.drop(d.W * (0.15 + Math.random() * 0.7), d.H * (0.15 + Math.random() * 0.7))
  },
})

const toPx = (e, snap = false) => {
  const r = demo.cv.getBoundingClientRect()
  const x = (e.clientX - r.left) / r.width * demo.W
  const y = (e.clientY - r.top) / r.height * demo.H
  // Pointer events can arrive as a jagged, low-rate polyline. A short event-space low-pass
  // removes those corners while staying close enough to the hand to feel immediate.
  if (snap) { sx = x; sy = y }
  else { sx += (x - sx) * 0.55; sy += (y - sy) * 0.55 }
}
demo.cv.addEventListener("pointerdown", (e) => {
  toPx(e, true); scheduleDrop(demo.t)
  down = true; stick = false; breakTrail = true; dx0 = sx; dy0 = sy
  try { demo.cv.setPointerCapture(e.pointerId) } catch {}
})
demo.cv.addEventListener("pointermove", (e) => {
  if (!down) return
  toPx(e)
  if (!stick && Math.hypot(sx - dx0, sy - dy0) > 8) stick = true   // it's a drag — engage the stick
})
demo.cv.addEventListener("pointerup", (e) => {
  if (down && !stick) demo.engine?.drop(dx0, dy0)                  // it was a clean click — drop
  down = false; stick = false
  try { demo.cv.releasePointerCapture(e.pointerId) } catch {}
})
demo.cv.addEventListener("pointerleave", () => { down = false; stick = false })
demo.cv.addEventListener("pointercancel", () => { down = false; stick = false })
demo.cv.addEventListener("wheel", (e) => {
  e.preventDefault(); scheduleDrop(demo.t)
  foc *= Math.exp(-e.deltaY * 0.001)
  if (foc < 80) foc = 80
  if (foc > 640) foc = 640
}, { passive: false })
</script>
</body>
</html>
