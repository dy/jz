<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Voronoi - jz</title>
<meta name="description" content="Brute-force nearest-site cells, drifting. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/voronoi/" />
<meta property="og:title" content="Voronoi - jz" />
<meta property="og:description" content="Brute-force nearest-site cells, drifting. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/voronoi/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/voronoi.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

const demo = runDemo({
  name: "voronoi",
  hint: "a Voronoi diagram of drifting sites · click to add one",
  size: { budget: 360000 },
  load: (e) => { e.init() },
  frame: (e, t) => { e.frame(t) },
})

demo.cv.addEventListener("pointerdown", (e) => {
  if (demo.engine) demo.engine.addSite(e.offsetX * demo.W / demo.cv.clientWidth, e.offsetY * demo.H / demo.cv.clientHeight)
})
</script>
</body>
</html>
