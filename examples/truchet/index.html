<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Truchet Tiles - jz</title>
<meta name="description" content="Two random arc tiles assemble into endless flowing labyrinths. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/truchet/" />
<meta property="og:title" content="Truchet Tiles - jz" />
<meta property="og:description" content="Two random arc tiles assemble into endless flowing labyrinths. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/truchet/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/truchet.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo, trackPointer } from "../lib/jzdemo.js"

let lastDown = false
const demo = runDemo({
  name: "truchet",
  hint: "Truchet tiles — click to re-seed, drag to change tile size",
  load: (e) => { e.init?.() },
  frame: (e, t) => {
    // Click (press and release) re-seeds
    if (!ptr.down && lastDown) e.seed?.()
    lastDown = ptr.down

    // Drag changes tile size: right = bigger tiles
    const tileSize = ptr.down ? (12 + ptr.x * 40) | 0 : 22
    e.frame(t, tileSize)
  },
})

const ptr = trackPointer(demo.cv)
</script>
</body>
</html>
