<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Truchet Tiles - jz</title>
<meta name="description" content="Two random arc tiles chain into an endless labyrinth, current running its paths; tap to spark. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/truchet/" />
<meta property="og:title" content="Truchet Tiles - jz" />
<meta property="og:description" content="Two random arc tiles chain into an endless labyrinth, current running its paths; tap to spark. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/truchet/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/truchet.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

// A tap sparks current into the touched tile; a horizontal drag sets the tile size; the dice re-seeds.
let tile = 22, downX = 0, downTile = 22, dragging = false, moved = false
const demo = runDemo({
  name: "truchet",
  hint: "Truchet tiles, current running their paths — tap to spark · drag ↔ for tile size · dice re-seeds",
  cursor: "pointer",
  load: (e) => { e.init?.() },
  frame: (e, t) => e.frame(t, tile),
  randomize: (e) => e.seed(),
})
const cv = demo.cv
cv.addEventListener("pointerdown", (e) => { dragging = true; moved = false; downX = e.clientX; downTile = tile; try { cv.setPointerCapture(e.pointerId) } catch {} })
cv.addEventListener("pointermove", (e) => {
  if (!dragging) return
  const dx = e.clientX - downX
  if (Math.abs(dx) > 6) moved = true
  if (moved) tile = Math.max(10, Math.min(60, Math.round(downTile + dx * 0.08)))
})
cv.addEventListener("pointerup", (e) => {
  if (dragging && !moved) { const r = cv.getBoundingClientRect(); demo.engine?.spark((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, tile) }
  dragging = false
})
cv.addEventListener("pointerleave", () => { dragging = false })
</script>
</body>
</html>
