<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Hyperbolic Tiling - jz</title>
<meta name="description" content="A tessellation of the Poincaré disk — Escher's Circle Limit. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/hyperbolic/" />
<meta property="og:title" content="Hyperbolic Tiling - jz" />
<meta property="og:description" content="A tessellation of the Poincaré disk — Escher's Circle Limit. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/hyperbolic/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/hyperbolic.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo, trackPointer } from "../lib/jzdemo.js"

let baseAngle = 0.0, userSet = false
const demo = runDemo({
  name: "hyperbolic",
  hint: "Poincaré disk tessellation — drag to rotate the hyperbolic plane",
  frame: (e, t) => {
    let rot
    if (ptr.down) {
      // Map horizontal drag to rotation angle: full width = full rotation
      rot = (ptr.x * 2 - 1) * Math.PI
      baseAngle = rot
      userSet = true
    } else {
      // Slow autonomous rotation when not dragging
      const drift = userSet ? 0.0 : 0.12
      rot = baseAngle + t * drift
    }
    e.frame(t, rot)
  },
})
const ptr = trackPointer(demo.cv)
</script>
</body>
</html>
