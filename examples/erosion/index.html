<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Erosion - jz</title>
<meta name="description" content="Hydraulic erosion — rain carves the terrain; flux pools into a river network. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/erosion/" />
<meta property="og:title" content="Erosion - jz" />
<meta property="og:description" content="Hydraulic erosion — rain carves the terrain; flux pools into a river network. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/erosion/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/erosion.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

const sx = (d) => d.W / d.cv.clientWidth, sy = (d) => d.H / d.cv.clientHeight

const demo = runDemo({
  name: "erosion",
  hint: "hydraulic erosion — rain carves a fractal terrain, flux pools into a river network · click for a rain burst",
  size: { budget: 300000 },
  bg: "#888",
  cursor: "pointer",
  frame: (e) => e.frame(0),
})
demo.cv.addEventListener("pointerdown", (e) => demo.engine?.rain(e.offsetX * sx(demo), e.offsetY * sy(demo)))
</script>
</body>
</html>
