<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>DLA - jz</title>
<meta name="description" content="Diffusion-limited aggregation — click to race competing crystals for the walker supply. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/dla/" />
<meta property="og:title" content="DLA - jz" />
<meta property="og:description" content="Diffusion-limited aggregation — click to race competing crystals for the walker supply. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/dla/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/dla.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

const demo = runDemo({
  name: "dla",
  hint: "diffusion-limited aggregation — click to plant a competing crystal · double-click to reseed",
  size: { budget: 750000 },
  load: (e) => e.seed(),
  frame: (e) => e.frame(0),
})
const sx = () => demo.W / demo.cv.clientWidth, sy = () => demo.H / demo.cv.clientHeight
demo.cv.addEventListener("click", (e) => demo.engine && demo.engine.addSeed(e.offsetX * sx(), e.offsetY * sy()))
demo.cv.addEventListener("dblclick", () => demo.engine.seed())
</script>
</body>
</html>
