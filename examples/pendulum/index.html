<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Double Pendulum - jz</title>
<meta name="description" content="Every pixel an initial angle, shaded by time-to-flip — click a pixel to fly that pendulum live. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/pendulum/" />
<meta property="og:title" content="Double Pendulum - jz" />
<meta property="og:description" content="Every pixel an initial angle, shaded by time-to-flip — click a pixel to fly that pendulum live. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/pendulum/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/pendulum.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

// The time-to-flip fractal is PLAYABLE: click any pixel to launch that initial condition as
// a live double pendulum — its (θ1,θ2) trajectory snakes over the map with a comet trail
// while the corner widget swings the same state as real rods; the trail bursts the moment
// the lower arm flips (the very event the map colors). Idle launches keep it breathing.
let nextLaunch = 0
const schedule = (t) => { nextLaunch = t + 1.2 + Math.random() * 0.6 }

const demo = runDemo({
  name: "pendulum",
  hint: "each pixel an initial angle pair, colored by time-to-flip · click to launch that pendulum live",
  size: { budget: 90000 },
  frame: (e, t) => {
    if (nextLaunch === 0) { schedule(t - 3) }             // first launch soon after load
    if (t >= nextLaunch) {
      e.launch(demo.W * (0.1 + Math.random() * 0.8), demo.H * (0.1 + Math.random() * 0.8))
      schedule(t)
    }
    e.frame(t)
  },
  randomize: (e, d) => {
    for (let i = 0; i < 3; i++) e.launch(d.W * (0.1 + Math.random() * 0.8), d.H * (0.1 + Math.random() * 0.8))
  },
})

demo.cv.addEventListener("pointerdown", (e) => {
  const r = demo.cv.getBoundingClientRect()
  demo.engine?.launch((e.clientX - r.left) / r.width * demo.W, (e.clientY - r.top) / r.height * demo.H)
})
</script>
</body>
</html>
