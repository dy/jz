<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Rule 30 - jz</title>
<meta name="description" content="Wolfram's elementary CA — one rule, endless aperiodic complexity. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/rule30/" />
<meta property="og:title" content="Rule 30 - jz" />
<meta property="og:description" content="Wolfram's elementary CA — one rule, endless aperiodic complexity. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/rule30/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/rule30.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo, trackPointer } from "../lib/jzdemo.js"

let rule = 30                              // the iconic chaotic rule — the default
const demo = runDemo({
  name: "rule30",
  hint: "Wolfram Rule 30 — drag ↔ to change the rule (0–255), double-click to reseed",
  size: { budget: 160000 },
  load: (e) => e.init?.(),
  frame: (e, t) => e.frame(t, rule),
})
const ptr = trackPointer(demo.cv)
// rule changes only on a drag (a plain click/double-click leaves it alone)
demo.cv.addEventListener("pointermove", () => { if (ptr.down) rule = Math.max(0, Math.min(255, Math.floor(ptr.x * 256))) })
demo.cv.addEventListener("dblclick", () => { if (demo.engine && demo.engine.seed) demo.engine.seed() })
</script>
</body>
</html>
