<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Buddhabrot - jz</title>
<meta name="description" content="Density of Mandelbrot escape orbits — a luminous nebula accumulates. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/buddhabrot/" />
<meta property="og:title" content="Buddhabrot - jz" />
<meta property="og:description" content="Density of Mandelbrot escape orbits — a luminous nebula accumulates. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/buddhabrot/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/buddhabrot.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo, panZoom } from "../lib/jzdemo.js"

// The nebula is a DECAYING accumulator (see buddhabrot.js), so pan/zoom needs NO wipe: the old
// view fades out over ~½s while the new one sharpens in place — quality is retained, never a
// flash to black. Default frames the whole set (centre −0.5, half-height 1.5). Drag to pan,
// scroll to zoom, double-click to reset the view.
const home = { cx: -0.5, cy: 0, scale: 1.5 }
const view = { ...home }
const demo = runDemo({
  name: "buddhabrot",
  hint: "Buddhabrot nebula — drag to pan · scroll to zoom",
  load: (e) => { if (e.init) e.init() },
  frame: (e, t) => { e.frame(t, view.cx, view.cy, view.scale) },
})
panZoom(demo.cv, view, home, () => {})   // view moves freely; the decay handles the transition
</script>
</body>
</html>
