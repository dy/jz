<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Maze - jz</title>
<meta name="description" content="Recursive-backtracker maze, then BFS solve. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/maze/" />
<meta property="og:title" content="Maze - jz" />
<meta property="og:description" content="Recursive-backtracker maze, then BFS solve. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/maze/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/maze.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

const demo = runDemo({
  name: "maze",
  hint: "a maze, carved then solved by flood-fill — click to regenerate",
  size: { budget: 110000, odd: true },   // odd dims = walls + passages; chunky cells, CSS upscales
  bg: "#000",
  cursor: "pointer",
  frame: (e) => e.frame(0),
  // re-roll: carve and solve a brand-new maze
  randomize: (e) => e.restart?.(),
})
demo.cv.addEventListener("pointerdown", () => { if (demo.engine) demo.engine.restart() })
</script>
</body>
</html>
