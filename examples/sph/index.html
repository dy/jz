<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Particle Fluid - jz</title>
<meta name="description" content="Smoothed-particle-style liquid — pairwise repulsion &amp; viscosity, the classic O(N²) sum. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/sph/" />
<meta property="og:title" content="Particle Fluid - jz" />
<meta property="og:description" content="Smoothed-particle-style liquid — pairwise repulsion &amp; viscosity, the classic O(N²) sum. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/sph/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/sph.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo, trackPointer } from "../lib/jzdemo.js"

const demo = runDemo({
  name: "sph",
  hint: "particle liquid — every pair repels & drags within a smoothing radius, O(N²) · drag to push it",
  size: { budget: 500000 },
  load: (e) => e.init(),
  frame: (e) => { if (e.setPointer) e.setPointer(ptr.x, ptr.y, ptr.down ? 1 : 0); e.frame(0) },
})
const ptr = trackPointer(demo.cv)
demo.cv.addEventListener("dblclick", () => demo.engine && demo.engine.init())
</script>
</body>
</html>
