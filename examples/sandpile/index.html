<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=0" />
<title>Sandpile - jz</title>
<meta name="description" content="Bak–Tang–Wiesenfeld sandpile — avalanches self-organize grains into a fractal mandala. Plain JavaScript compiled to WebAssembly with jz." />
<link rel="canonical" href="https://jz.js.org/examples/sandpile/" />
<meta property="og:title" content="Sandpile - jz" />
<meta property="og:description" content="Bak–Tang–Wiesenfeld sandpile — avalanches self-organize grains into a fractal mandala. Plain JavaScript compiled to WebAssembly with jz." />
<meta property="og:url" content="https://jz.js.org/examples/sandpile/" />
<meta property="og:image" content="https://jz.js.org/examples/thumbs/sandpile.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../../jz.svg" type="image/svg+xml" />
</head>
<body>
<script type="module">
import { runDemo } from "../lib/jzdemo.js"

const demo = runDemo({
  name: "sandpile",
  hint: "Abelian sandpile · click seeds a mandala · drag pours grains",
  size: { budget: 1048576 },
  load: (e) => e.seed(),
  frame: (e, t) => e.frame(t),
})

// click = a new permanent source (colliding mandalas where two fronts meet);
// drag = pour a trail of grains along the path (a one-off deposit, not a new emitter).
const POUR = 60
let painting = false, lastX = 0, lastY = 0
const toCanvas = (x, y) => [x * demo.W / demo.cv.clientWidth, y * demo.H / demo.cv.clientHeight]
const strokeTo = (x, y) => {
  const dx = x - lastX, dy = y - lastY, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 4))
  for (let i = 1; i <= n; i++) {
    const [cx, cy] = toCanvas(lastX + dx * i / n, lastY + dy * i / n)
    demo.engine.pour(cx, cy, POUR)
  }
  lastX = x; lastY = y
}
demo.cv.addEventListener("pointerdown", (e) => {
  painting = true; lastX = e.offsetX; lastY = e.offsetY
  try { demo.cv.setPointerCapture(e.pointerId) } catch {}
  const [cx, cy] = toCanvas(e.offsetX, e.offsetY)
  demo.engine.addSource(cx, cy)
})
demo.cv.addEventListener("pointermove", (e) => { if (painting) strokeTo(e.offsetX, e.offsetY) })
demo.cv.addEventListener("pointerup", (e) => { painting = false; try { demo.cv.releasePointerCapture(e.pointerId) } catch {} })
demo.cv.addEventListener("pointerleave", () => { painting = false })
</script>
</body>
</html>
